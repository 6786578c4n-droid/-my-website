<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b10">

<title>PSN Online ID Finder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #090b10;
    color: #ffffff;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 15% 10%, rgba(88,101,242,.18), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(0,210,255,.10), transparent 30%);
}

.container {
    position: relative;
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 25px 16px 50px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 55px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 20px;
    background: linear-gradient(135deg, #5865f2, #7289da);
    box-shadow: 0 10px 35px rgba(88,101,242,.3);
}

.logo-text h1 {
    margin: 0;
    font-size: 15px;
}

.logo-text p {
    margin: 3px 0 0;
    font-size: 11px;
    color: #777f91;
}

.status {
    padding: 8px 12px;
    border-radius: 50px;
    border: 1px solid #242936;
    background: #10131a;
    color: #9ba3b5;
    font-size: 11px;
}

/* HERO */

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h2 {
    margin: 0 0 15px;
    font-size: clamp(34px, 8vw, 58px);
    letter-spacing: -2px;
}

.hero h2 span {
    color: #7289da;
}

.hero p {
    margin: auto;
    max-width: 560px;
    color: #858c9d;
    font-size: 14px;
    line-height: 1.6;
}

/* CARD */

.card {
    background: rgba(16,19,26,.9);
    border: 1px solid #252a36;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,.35);
    backdrop-filter: blur(20px);
}

/* TABS */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: #12161e;
    color: #858c9d;
    font-weight: 700;
}

.tab.active {
    background: #252c48;
    color: white;
}

/* FORM */

label {
    display: block;
    margin-bottom: 8px;
    color: #aeb5c5;
    font-size: 12px;
}

.input-row {
    display: flex;
    gap: 8px;
}

.input {
    width: 100%;
    background: #0b0e14;
    border: 1px solid #2a303c;
    border-radius: 14px;
    padding: 15px;
    color: white;
    font-size: 16px;
    outline: none;
}

.input:focus {
    border-color: #5865f2;
}

textarea.input {
    resize: vertical;
}

.button {
    border: 0;
    border-radius: 14px;
    padding: 0 22px;
    min-height: 52px;
    background: #5865f2;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.button:active {
    transform: scale(.98);
}

.hint {
    margin-top: 9px;
    color: #656d7d;
    font-size: 11px;
}

/* RESULT */

.result-box {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #252a36;
    background: #0b0e14;
}

.result-box.show {
    display: block;
}

.result-title {
    color: #777f91;
    font-size: 11px;
    margin-bottom: 7px;
}

.result-id {
    font-size: 21px;
    font-weight: 800;
    word-break: break-word;
}

.result-status {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 800;
}

.result-status.available {
    color: #5ee0a5;
    background: #123c2c;
}

.result-status.taken {
    color: #ff7b91;
    background: #3c1720;
}

.result-status.unknown {
    color: #e9d76a;
    background: #2d2b17;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.stat {
    background: #0c1016;
    border: 1px solid #202631;
    border-radius: 14px;
    padding: 13px;
}

.stat b {
    display: block;
    font-size: 21px;
}

.stat span {
    color: #707888;
    font-size: 10px;
}

/* BULK RESULTS */

.bulk-results {
    display: none;
    margin-top: 15px;
    border: 1px solid #202631;
    border-radius: 15px;
    overflow: hidden;
}

.bulk-results.show {
    display: block;
}

.bulk-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #202631;
}

.bulk-item:last-child {
    border-bottom: 0;
}

.bulk-id {
    font-size: 13px;
    font-weight: 700;
}

.bulk-status {
    font-size: 9px;
    font-weight: 800;
    padding: 6px 8px;
    border-radius: 50px;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 25px;
    color: #555d6c;
    font-size: 11px;
}

/* MOBILE */

@media (max-width: 550px) {

    .container {
        padding-top: 18px;
    }

    .status {
        display: none;
    }

    .header {
        margin-bottom: 40px;
    }

    .card {
        padding: 15px;
        border-radius: 20px;
    }

    .input-row {
        flex-direction: column;
    }

    .button {
        width: 100%;
    }

    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

    .hero h2 {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="logo-area">

            <div class="logo">
                P
            </div>

            <div class="logo-text">
                <h1>PSN Online ID Finder</h1>
                <p>Web Edition</p>
            </div>

        </div>

        <div class="status">
            iPhone Ready
        </div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h2>
            Find your <span>PSN ID</span>
        </h2>

        <p>
            Check PlayStation Online IDs using a clean,
            fast and mobile-friendly interface.
        </p>

    </section>


    <!-- MAIN -->

    <main class="card">

        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="singleTab">
                Single Check
            </button>

            <button
                class="tab"
                id="bulkTab">
                Bulk Check
            </button>

        </div>


        <!-- SINGLE -->

        <div id="singleSection">

            <label>
                PlayStation Online ID
            </label>

            <div class="input-row">

                <input
                    id="psnInput"
                    class="input"
                    type="text"
                    placeholder="Enter PSN ID..."
                    autocomplete="off"
                >

                <button
                    class="button"
                    id="checkButton">
                    CHECK
                </button>

            </div>

            <div class="hint">
                Enter an Online ID and press CHECK.
            </div>


            <!-- RESULT APPEARS DIRECTLY UNDER INPUT -->

            <div
                class="result-box"
                id="resultBox">

                <div class="result-title">
                    RESULT
                </div>

                <div
                    class="result-id"
                    id="resultId">
                </div>

                <div
                    class="result-status unknown"
                    id="resultStatus">
                    WAITING
                </div>

            </div>

        </div>


        <!-- BULK -->

        <div
            id="bulkSection"
            style="display:none;">

            <label>
                PSN IDs — one per line
            </label>

            <textarea
                id="bulkInput"
                class="input"
                rows="7"
                placeholder="player_one
player_two
player_three"></textarea>

            <button
                class="button"
                id="bulkButton"
                style="width:100%;margin-top:10px;">
                START SCAN
            </button>


            <div
                class="bulk-results"
                id="bulkResults">
            </div>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <b id="total">0</b>
                <span>TOTAL</span>
            </div>

            <div class="stat">
                <b id="available">0</b>
                <span>AVAILABLE</span>
            </div>

            <div class="stat">
                <b id="checked">0</b>
                <span>CHECKED</span>
            </div>

        </div>

    </main>


    <footer class="footer">
        PSN Online ID Finder · Web Interface
    </footer>

</div>


<script>

/* =========================
   TABS
========================= */

const singleTab =
    document.getElementById("singleTab");

const bulkTab =
    document.getElementById("bulkTab");

const singleSection =
    document.getElementById("singleSection");

const bulkSection =
    document.getElementById("bulkSection");


singleTab.onclick = function () {

    singleSection.style.display = "block";
    bulkSection.style.display = "none";

    singleTab.classList.add("active");
    bulkTab.classList.remove("active");

};


bulkTab.onclick = function () {

    singleSection.style.display = "none";
    bulkSection.style.display = "block";

    bulkTab.classList.add("active");
    singleTab.classList.remove("active");

};


/* =========================
   SINGLE CHECK
========================= */

const psnInput =
    document.getElementById("psnInput");

const checkButton =
    document.getElementById("checkButton");

const resultBox =
    document.getElementById("resultBox");

const resultId =
    document.getElementById("resultId");

const resultStatus =
    document.getElementById("resultStatus");


checkButton.onclick = function () {

    const id =
        psnInput.value.trim();

    if (!id) {

        psnInput.focus();

        return;
    }


    /*
      Demo result.

      Real PSN verification requires
      a server-side backend.
    */

    resultBox.classList.add("show");

    resultId.textContent = id;

    resultStatus.textContent =
        "CHECK REQUIRED";

    resultStatus.className =
        "result-status unknown";


    document.getElementById("total")
        .textContent = "1";

    document.getElementById("checked")
        .textContent = "1";

};


/* =========================
   BULK CHECK
========================= */

const bulkInput =
    document.getElementById("bulkInput");

const bulkButton =
    document.getElementById("bulkButton");

const bulkResults =
    document.getElementById("bulkResults");


bulkButton.onclick = function () {

    const ids =
        bulkInput.value
        .split(/\n+/)
        .map(id => id.trim())
        .filter(Boolean);


    bulkResults.innerHTML = "";

    if (ids.length === 0) {

        bulkResults.classList.remove("show");

        return;
    }


    bulkResults.classList.add("show");


    document.getElementById("total")
        .textContent = ids.length;

    document.getElementById("checked")
        .textContent = ids.length;

    document.getElementById("available")
        .textContent = "0";


    ids.forEach(function(id) {

        const item =
            document.createElement("div");

        item.className =
            "bulk-item";


        const name =
            document.createElement("span");

        name.className =
            "bulk-id";

        name.textContent = id;


        const status =
            document.createElement("span");

        status.className =
            "bulk-status unknown";

        status.textContent =
            "CHECK REQUIRED";


        item.appendChild(name);

        item.appendChild(status);

        bulkResults.appendChild(item);

    });

};

</script>

</body>
</html>
